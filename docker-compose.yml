services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospitalops
      POSTGRES_USER: hospitalops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Debes definir POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitalops"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://hospitalops:${POSTGRES_PASSWORD}@db:5432/hospitalops
      SESSION_SECRET: ${SESSION_SECRET:?Debes definir SESSION_SECRET}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
