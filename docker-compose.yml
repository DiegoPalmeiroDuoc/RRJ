services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospitalops
      POSTGRES_USER: hospitalops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitalops -d hospitalops"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://hospitalops:${POSTGRES_PASSWORD}@db:5432/hospitalops
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en el archivo .env}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
