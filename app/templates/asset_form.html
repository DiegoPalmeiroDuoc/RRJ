{% extends 'base.html' %}{% block title %}{{ 'Editar equipo' if item else 'Nuevo equipo' }}{% endblock %}{% block content %}
<div class="page-heading"><div><a class="back-link" href="/assets">← Volver a equipos</a><h1>{{ 'Editar equipo' if item else 'Registrar equipo' }}</h1><p>Identificación, localización y datos técnicos.</p></div></div>
<section class="panel form-panel"><form method="post" action="{{ '/assets/' ~ item.id ~ '/save' if item else '/assets/new' }}"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><div class="form-grid"><label>Código activo *<input name="code" value="{{ item.code if item else '' }}" required placeholder="EQ-0001"></label><label>Nombre *<input name="name" value="{{ item.name if item else '' }}" required placeholder="Monitor multiparámetro"></label><label>Categoría<input name="category" value="{{ item.category if item else 'Equipamiento médico' }}"></label><label>N° de serie<input name="serial_number" value="{{ item.serial_number if item else '' }}"></label><label>Ubicación<input name="location" value="{{ item.location if item else '' }}" placeholder="UCI, box 4"></label><label class="checkbox-label"><input type="checkbox" name="active" {% if not item or item.active %}checked{% endif %}> Equipo activo</label></div><div class="form-actions"><a href="/assets" class="btn btn-secondary">Cancelar</a><button class="btn btn-primary">Guardar equipo</button></div></form></section>
{% endblock %}
