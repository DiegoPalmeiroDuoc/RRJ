{% extends 'base.html' %}{% block title %}Solicitar acceso{% endblock %}{% block auth_content %}
<div class="auth-card"><div class="eyebrow">ACCESO INSTITUCIONAL</div><h2>Solicita una cuenta</h2><p>Un administrador validará tu solicitud antes de habilitarte.</p><form method="post" action="/register" class="form-stack"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label>Nombre completo<input name="name" maxlength="150" required></label><label>Correo institucional<input name="email" type="email" maxlength="160" required></label><label>Hospital<select name="hospital_id" required><option value="">Selecciona un hospital</option>{% for h in public_hospitals %}<option value="{{ h.id }}">{{ h.name }}</option>{% endfor %}</select></label><label>Cargo<input name="job_title" maxlength="120" placeholder="Ej.: Enfermero/a, Jefatura, Administrativo/a"></label><label>Contraseña (mínimo 10 caracteres)<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><button class="btn btn-primary btn-wide">Enviar solicitud →</button></form><p class="auth-bottom"><a href="/login">← Volver al inicio de sesión</a></p></div>
{% endblock %}
