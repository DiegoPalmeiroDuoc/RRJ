{% extends 'base.html' %}{% block title %}{{ 'Editar oportunidad' if item else 'Nueva oportunidad' }}{% endblock %}{% block content %}
<div class="page-heading"><div><a class="back-link" href="/crm">← Volver al pipeline</a><h1>{{ 'Editar oportunidad' if item else 'Nueva oportunidad' }}</h1><p>Seguimiento comercial desde el contacto hasta el cierre.</p></div></div><section class="panel form-panel"><form method="post" action="{{ '/crm/opportunities/' ~ item.id ~ '/edit' if item else '/crm/opportunities/new' }}"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><div class="form-grid"><label class="span-2">Nombre de la oportunidad *<input name="name" value="{{ item.name if item else '' }}" required></label><label>Valor estimado (CLP)<input name="value" type="number" min="0" step="0.01" value="{{ item.value if item else 0 }}"></label><label>Etapa<select name="stage">{% for st in stages %}<option value="{{ st }}" {% if item and item.stage == st %}selected{% endif %}>{{ st|capitalize }}</option>{% endfor %}</select></label><label>Contacto<select name="contact_id"><option value="">Sin contacto</option>{% for c in contacts %}<option value="{{ c.id }}" {% if item and item.contact_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Responsable<select name="owner_id"><option value="">Sin asignar</option>{% for o in owners %}<option value="{{ o.id }}" {% if item and item.owner_id == o.id %}selected{% endif %}>{{ o.name }}</option>{% endfor %}</select></label><label>Fecha de cierre prevista<input type="date" name="expected_close" value="{{ item.expected_close if item else '' }}"></label><label class="span-2">Notas<textarea name="notes" rows="5">{{ item.notes if item else '' }}</textarea></label></div><div class="form-actions"><a href="/crm" class="btn btn-secondary">Cancelar</a><button class="btn btn-primary">Guardar oportunidad</button></div></form></section>
{% endblock %}
