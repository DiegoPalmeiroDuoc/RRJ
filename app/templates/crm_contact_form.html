{% extends 'base.html' %}{% block title %}{{ 'Editar contacto' if item else 'Nuevo contacto' }}{% endblock %}{% block content %}
<div class="page-heading"><div><a class="back-link" href="/crm/contacts">← Volver a contactos</a><h1>{{ 'Editar contacto' if item else 'Nuevo contacto' }}</h1><p>Datos de contacto y antecedentes de relación.</p></div></div><section class="panel form-panel"><form method="post" action="{{ '/crm/contacts/' ~ item.id ~ '/edit' if item else '/crm/contacts/new' }}"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><div class="form-grid"><label>Nombre completo *<input name="name" value="{{ item.name if item else '' }}" required></label><label>Correo electrónico<input type="email" name="email" value="{{ item.email if item else '' }}"></label><label>Teléfono<input name="phone" value="{{ item.phone if item else '' }}"></label><label>Cargo<input name="job_title" value="{{ item.job_title if item else '' }}"></label><label>Área / Departamento<input name="department" value="{{ item.department if item else '' }}"></label><label class="span-2">Notas<textarea name="notes" rows="5">{{ item.notes if item else '' }}</textarea></label></div><div class="form-actions"><a href="/crm/contacts" class="btn btn-secondary">Cancelar</a><button class="btn btn-primary">Guardar contacto</button></div></form></section>
{% endblock %}
