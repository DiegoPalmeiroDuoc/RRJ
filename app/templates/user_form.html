{% extends 'base.html' %}{% block title %}{{ 'Editar usuario' if item else 'Nuevo usuario' }}{% endblock %}{% block content %}
<div class="page-heading"><div><a class="back-link" href="/users">← Volver a usuarios</a><h1>{{ 'Editar usuario' if item else 'Nuevo usuario' }}</h1><p>Asignación de privilegios y datos profesionales.</p></div></div>
<section class="panel form-panel"><form method="post" action="{{ '/users/' ~ item.id ~ '/edit' if item else '/users/new' }}"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><div class="section-title">Información y acceso</div><div class="form-grid"><label>Nombre completo *<input name="name" value="{{ item.name if item else '' }}" required></label><label>Correo electrónico *<input type="email" name="email" value="{{ item.email if item else '' }}" required></label><label>Rol *<select name="role" required>{% for value,label in roles.items() if value != 'superadmin' %}<option value="{{ value }}" {% if item and item.role == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Cargo<input name="job_title" placeholder="Ej. Jefe de mantenimiento" value="{{ item.job_title if item else '' }}"></label><label>Área / Servicio<select name="department_id"><option value="">Sin asignar</option>{% for d in deps %}<option value="{{ d.id }}" {% if item and item.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label><label>{{ 'Nueva contraseña (opcional)' if item else 'Contraseña (mínimo 10 caracteres) *' }}<input type="password" name="password" minlength="10" {% if not item %}required{% endif %} autocomplete="new-password"></label></div><div class="form-actions"><a href="/users" class="btn btn-secondary">Cancelar</a><button class="btn btn-primary">Guardar usuario</button></div></form></section>
{% endblock %}
